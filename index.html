<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clinic Flow to-do list with local storage." />
  <title>Clinic Flow Tasks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">Clinic Flow</p>
          <h1 id="page-title">Today's tasks</h1>
          <p class="subtitle">Keep your clinic workflow organized.</p>
        </div>
        <span class="task-count" id="task-count" aria-live="polite">0 remaining</span>
      </header>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" name="task" type="text" maxlength="120" placeholder="Add a task..." autocomplete="off" required />
        <button type="submit">Add task</button>
      </form>

      <div class="toolbar" aria-label="Task filters">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">Active</button>
          <button class="filter-button" type="button" data-filter="completed">Completed</button>
        </div>
        <button class="text-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state">No tasks yet. Add your first task above.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
